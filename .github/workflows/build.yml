name: Nightfall Windows validation
on:
  push:
    branches: [main, nightfall/main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix website ci
      - run: npm run gate:checks
      - run: npm run test:e2e
      - run: node scripts/build-windows.js
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Nightfall-Windows
          path: release/*.exe
